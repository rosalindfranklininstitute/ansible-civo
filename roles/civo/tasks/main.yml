---
# This role is used by including it with variables that describe the desired
# resource.  Example:
#
#   - name: Ensure network exists
#     ansible.builtin.include_role:
#       name: civo
#     vars:
#       civo_resource: network
#       civo_name: my-network
#       civo_state: present
#
# Alternatively every module can be called directly without going through this
# dispatcher task file.

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - civo_resource is defined
      - civo_name is defined
      - civo_resource in civo_resource_task_files
    fail_msg: >-
      Both 'civo_resource' and 'civo_name' must be defined when using the
      civo role dispatcher, and 'civo_resource' must be one of:
      {{ civo_resource_task_files.keys() | sort | join(', ') }}.
    quiet: true

- name: Manage Civo {{ civo_resource }}
  ansible.builtin.include_tasks: "{{ civo_resource_task_files[civo_resource] }}"
